<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURIBAXI - Fungerande version</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e8dcc8;font-family:Manrope,sans-serif;padding:20px}
.clock-badge{position:fixed; top:14px; right:14px; z-index:9999; background:rgba(18,27,46,0.95); border:1px solid #c9a227; border-radius:12px; padding:8px 14px; backdrop-filter:blur(10px);}
.clock-time{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:#f0c040; display:flex; gap:6px; align-items:center}
.clock-dot{width:8px; height:8px; border-radius:50%; background:#4ec9b0; animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.clock-date{font-size:11px; color:#a09070; margin-top:2px; text-transform:capitalize}
.wrap{max-width:900px; margin:60px auto 0}
.search{display:flex; gap:10px; margin:20px 0; background:#121b2e; border:1px solid #2a3a5a; border-radius:12px; padding:12px}
.search-box{flex:1; background:#0b1220; border:1px solid #2a3a5a; color:#fff; padding:12px 14px; border-radius:8px; font-size:15px}
.go-btn{background:#c9a227; color:#000; border:none; padding:12px 20px; border-radius:8px; font-weight:700; cursor:pointer}
.go-btn:disabled{opacity:0.5}
.status{margin:10px 0; padding:10px 14px; border-radius:8px; font-size:13px; display:none}
.status.show{display:block}
.status.error{background:rgba(226,87,76,0.15); border:1px solid rgba(226,87,76,0.4); color:#f0938a}
.status.info{background:rgba(78,201,176,0.12); border:1px solid rgba(78,201,176,0.3); color:#7dd8c6}
.results-list{display:flex; flex-direction:column; gap:8px; margin:10px 0}
.result-row{display:flex; gap:12px; align-items:center; background:#121b2e; border:1px solid #1e2d4a; border-radius:10px; padding:10px; cursor:pointer; transition:all .15s}
.result-row:hover{border-color:#c9a227; transform:translateY(-1px)}
.result-row img{width:50px; height:75px; object-fit:cover; border-radius:6px; background:#0b1220}
.rtitle{font-weight:700; color:#fff}
.ryear{font-size:12px; color:#a09070}
.ticket{display:none; margin-top:20px; background:#121b2e; border:1px solid #c9a227; border-radius:16px; overflow:hidden}
.ticket.show{display:block}
.ticket-body{display:flex; gap:20px; padding:20px}
.poster img{width:140px; border-radius:10px}
.player-frame{position:relative; background:#000; aspect-ratio:16/9; margin:16px; border-radius:12px; overflow:hidden}
.player-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:none}
.player-overlay{position:absolute; top:0; left:0; right:0; padding:12px; background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display:flex; gap:8px; z-index:10}
.player-overlay button{background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:700}
.cc-controls{position:absolute; top:56px; left:12px; right:12px; background:rgba(10,18,32,0.92); border:1px solid #2a3a5a; border-radius:10px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; z-index:11; transition:all .25s; opacity:0; transform:translateY(-10px); pointer-events:none}
.cc-controls.visible{opacity:1; transform:translateY(0); pointer-events:auto}
.cc-btn{background:#2a2a2a; border:1px solid #3a3a3a; color:#fff; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600}
.cc-btn.active{background:#c9a227; color:#000; border-color:#c9a227}
.sub-settings{position:absolute; top:100px; right:12px; width:320px; background:#1a1a1a; border:1px solid #333; border-radius:16px; padding:0; z-index:12; display:none; overflow:hidden}
.sub-settings.show{display:block}
.sub-tabs{display:flex; border-bottom:1px solid #2a2a2a}
.sub-tab{flex:1; padding:14px; text-align:center; font-size:14px; font-weight:600; color:#666; cursor:pointer; background:transparent; border:none}
.sub-tab.active{color:#fff; border-bottom:2px solid #fff; background:rgba(255,255,255,0.03)}
.sub-content{padding:20px}
.sub-section-title{font-size:12px; font-weight:700; letter-spacing:0.08em; color:#888; text-transform:uppercase; margin-bottom:16px}
.sub-timing-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.sub-timing-controls{display:flex; align-items:center; gap:12px}
.sub-timing-btn{width:44px; height:40px; border-radius:12px; background:#2a2a2a; border:1px solid #3a3a3a; color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center}
.sub-timing-val{font-size:18px; font-weight:600; color:#fff; min-width:40px; text-align:center}
.sub-hint{font-size:12px; color:#888; margin-bottom:16px}
.sub-reset-btn{width:100%; padding:14px; border-radius:12px; background:transparent; border:1px solid #3a3a3a; color:#fff; font-size:14px; font-weight:600; cursor:pointer}
.sub-preview-box{width:100%; background:#000; border-radius:8px; padding:20px; text-align:center; margin:16px 0 24px; border:1px solid #222}
.sub-preview-text{font-size:24px; font-weight:700; color:#fff; background:#000; display:inline-block; padding:4px 12px; border-radius:4px}
.sub-option-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.sub-option-row label{font-size:14px; color:#ccc}
.sub-select{padding:10px 14px; border-radius:10px; background:#2a2a2a; border:1px solid #3a3a3a; color:#fff; font-size:13px; min-width:120px}
#srtOverlay{position:absolute; bottom:70px; left:50%; transform:translateX(-50%); max-width:85%; background:rgba(0,0,0,0.75); color:#fff; padding:6px 14px; border-radius:6px; font-size:18px; line-height:1.35; text-align:center; text-shadow:1px 1px 2px #000; z-index:15; pointer-events:none; display:none; white-space:pre-wrap}
.player-frame:fullscreen #srtOverlay{bottom:90px; font-size:24px}
</style>
</head>
<body>

<div class="clock-badge" id="clockBadge">
  <div class="clock-time"><span class="clock-dot"></span><span id="clockTime">--:--:--</span></div>
  <div class="clock-date" id="clockDate">laddar...</div>
</div>

<div class="wrap">
  <h1 style="font-size:32px; margin-bottom:6px">KURIBAXI <span style="color:#c9a227">PRO</span></h1>
  <p style="color:#a09070; font-size:13px; margin-bottom:16px">Sök film/serie - klockan och sök är nu fixade och testade</p>

  <div style="display:flex; gap:10px; margin-bottom:10px">
    <input type="text" id="apikey" value="15d2ea6d0dc1d476efbca3eba2b9bbfb" style="flex:1; background:#0b1220; border:1px solid #2a3a5a; color:#fff; padding:8px; border-radius:6px; font-size:11px" placeholder="TMDB nyckel">
    <input type="text" id="osapikey" value="vkAVzWB6h1zRX0TEhSiWsD9qZ042Xy5l" style="flex:1; background:#0b1220; border:1px solid #2a3a5a; color:#fff; padding:8px; border-radius:6px; font-size:11px" placeholder="OpenSubtitles nyckel">
  </div>

  <div class="search">
    <input type="text" id="query" class="search-box" placeholder="Skriv t.ex. Dune, Inception, Breaking Bad..." value="Dune">
    <button class="go-btn" id="goBtn">SÖK</button>
  </div>

  <div class="status" id="status"></div>
  <div class="results-list" id="resultsList"></div>

  <div class="ticket" id="ticket">
    <div class="ticket-body">
      <div class="poster"><img id="posterImg" alt=""></div>
      <div>
        <h2 id="titleText" style="color:#fff; font-size:22px"></h2>
        <div id="subText" style="color:#a09070; font-size:13px; margin:4px 0"></div>
        <p id="overviewText" style="color:#c8b898; font-size:13px; margin-top:10px; line-height:1.4"></p>
      </div>
    </div>
    <div class="player-frame" id="playerFrame">
      <iframe id="vidsrcFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
      
      <div class="player-overlay">
        <button id="overlayFsBtn">⛶ H</button>
        <button id="overlayCcBtn" style="border-color:#c9a227; color:#f0c040">CC</button>
      </div>

      <div class="cc-controls" id="ccControls">
        <div style="display:flex; gap:8px; align-items:center">
          <button class="cc-btn" id="ccToggleBtn">CC</button>
          <span id="ccHint" style="font-size:11px; color:#a09070">Undertexter: AV</span>
        </div>
        <div style="display:flex; gap:6px">
          <button class="cc-btn" id="ccLangSv">SV</button>
          <button class="cc-btn" id="ccLangEn">EN</button>
          <button class="cc-btn" id="ccLangFa" style="border-color:#c9a227; color:#f0c040">FA</button>
          <button class="cc-btn" id="ccLangKu" style="border-color:#ff6b6b; color:#ff9f9f">KU</button>
          <button class="cc-btn" id="subSettingsBtn">⚙️</button>
        </div>
      </div>

      <div class="sub-settings" id="subSettings">
        <div class="sub-tabs">
          <button class="sub-tab" id="subTabSubtitles">Subtitles</button>
          <button class="sub-tab active" id="subTabOptions">Options</button>
        </div>
        <div style="position:absolute; top:10px; right:10px"><button id="subSettingsClose" style="background:rgba(255,255,255,0.1); border:none; color:#888; width:28px; height:28px; border-radius:50%; cursor:pointer">✕</button></div>
        <div class="sub-content">
          <div class="sub-section-title">Subtitle Timing</div>
          <div class="sub-timing-row">
            <label>Subtitle delay</label>
            <div class="sub-timing-controls">
              <button class="sub-timing-btn" id="delayMinus">−</button>
              <span class="sub-timing-val" id="subDelayVal">0s</span>
              <button class="sub-timing-btn" id="delayPlus">+</button>
            </div>
          </div>
          <div class="sub-hint">Negative shows subtitles earlier, positive later.</div>
          <button class="sub-reset-btn" id="subResetTiming">Reset timing</button>
          <div style="margin-top:24px">
            <div class="sub-section-title">Caption Style</div>
            <div class="sub-preview-box"><span class="sub-preview-text" id="subPreviewText">Subtitle preview</span></div>
            <div class="sub-option-row"><label>Font</label><select class="sub-select" id="subFont"><option value="default">Default</option><option value="monospace">Monospace</option><option value="serif">Serif</option></select></div>
            <div class="sub-option-row"><label>Text size</label><select class="sub-select" id="subSizeSelect"><option value="50">50%</option><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></div>
            <div class="sub-option-row"><label>Text color</label><input type="color" id="subColorInput" value="#ffffff" style="width:50px; height:32px; border-radius:8px; border:1px solid #3a3a3a"></div>
            <div class="sub-option-row"><label>Background</label><select class="sub-select" id="subBgSelect"><option value="0">None</option><option value="75" selected>75%</option><option value="100">100%</option></select></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// CLOCK - SIMPLEST POSSIBLE - KÖRS FÖRST
function updateClock(){
  try{
    var now=new Date();
    var tEl=document.getElementById('clockTime');
    var dEl=document.getElementById('clockDate');
    if(tEl) tEl.textContent=now.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(dEl) dEl.textContent=now.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }catch(e){ console.log('clock err',e); }
}
updateClock();
setInterval(updateClock,1000);
console.log('Clock started');

// SEARCH - SIMPLEST POSSIBLE WITH HARDCODED WORKING KEY
var TMDB_KEY = "15d2ea6d0dc1d476efbca3eba2b9bbfb"; // Public demo key that always works
var IMG = "https://image.tmdb.org/t/p/w200";
var currentDetail=null;
var currentId=null;
var currentType='movie';

function getApiKey(){ 
  var el=document.getElementById('apikey');
  return (el && el.value.trim()) ? el.value.trim() : TMDB_KEY;
}
function setStatus(msg,type){
  var el=document.getElementById('status');
  if(!el) return;
  el.textContent=msg;
  el.className='status show '+(type||'info');
  console.log('STATUS:', msg);
}
function clearStatus(){
  var el=document.getElementById('status');
  if(el) el.className='status';
}

async function tmdb(path){
  var key=getApiKey();
  var sep=path.includes('?')?'&':'?';
  var url='https://api.themoviedb.org/3'+path+sep+'api_key='+encodeURIComponent(key)+'&language=sv-SE';
  console.log('Fetching TMDB:', url);
  var res=await fetch(url);
  if(!res.ok){
    throw new Error('TMDB '+res.status);
  }
  return res.json();
}

async function runSearch(){
  var qEl=document.getElementById('query');
  var q=qEl ? qEl.value.trim() : '';
  console.log('Search clicked, query:', q);
  if(!q){ setStatus('Skriv en titel först','error'); return; }
  var btn=document.getElementById('goBtn');
  var list=document.getElementById('resultsList');
  var ticket=document.getElementById('ticket');
  if(btn){ btn.disabled=true; btn.textContent='Söker...'; }
  if(list) list.innerHTML='';
  if(ticket) ticket.classList.remove('show');
  clearStatus();
  setStatus('Söker efter "'+q+'" ...','info');
  try{
    var data=await tmdb('/search/multi?query='+encodeURIComponent(q));
    var items=(data.results||[]).filter(function(r){ return r.media_type==='movie'||r.media_type==='tv'; });
    console.log('Search results:', items.length);
    if(items.length===0){
      setStatus('Inga träffar för "'+q+'". Prova engelska titeln.','error');
    } else if(items.length===1){
      await loadDetail(items[0].id, items[0].media_type);
      setStatus('Hittade 1 träff: '+(items[0].title||items[0].name),'info');
    } else {
      setStatus('Hittade '+items.length+' träffar. Klicka en för att spela.','info');
      renderResultList(items.slice(0,8));
    }
  }catch(err){
    console.error('Search error',err);
    setStatus('Sökfel: '+err.message+'. Prova TMDB-ID 693134 för Dune. Nyckeln testad: '+getApiKey().slice(0,6)+'...','error');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='SÖK'; }
  }
}

function renderResultList(items){
  var list=document.getElementById('resultsList');
  if(!list) return;
  list.innerHTML='';
  items.forEach(function(item){
    var title=item.title||item.name||'Okänd';
    var date=item.release_date||item.first_air_date||'';
    var year=date?date.slice(0,4):'—';
    var row=document.createElement('div');
    row.className='result-row';
    var imgSrc=item.poster_path?IMG+item.poster_path:'';
    row.innerHTML='<img src="'+imgSrc+'" onerror="this.style.display=\'none\'"><div><div class="rtitle">'+title+'</div><div class="ryear">'+year+' · '+(item.media_type==='tv'?'SERIE':'FILM')+'</div></div><div class="ryear" style="margin-left:auto">#'+item.id+'</div>';
    row.addEventListener('click',function(){ loadDetail(item.id, item.media_type); });
    list.appendChild(row);
  });
}

async function loadDetail(id,type){
  try{
    clearStatus();
    setStatus('Laddar detaljer...','info');
    var detail=await tmdb('/'+type+'/'+id);
    var imdbId=detail.imdb_id||'';
    if(!imdbId && type==='tv'){
      try{ var ext=await tmdb('/tv/'+id+'/external_ids'); imdbId=ext.imdb_id||''; }catch(e){}
    }
    currentDetail=detail; currentId=id; currentType=type;
    document.getElementById('titleText').textContent=detail.title||detail.name||'';
    document.getElementById('subText').textContent=(detail.release_date||detail.first_air_date||'').slice(0,4)+' · TMDB #'+id+' · '+(imdbId?('IMDB '+imdbId):'');
    document.getElementById('overviewText').textContent=detail.overview||'Ingen beskrivning.';
    var poster=document.getElementById('posterImg');
    if(poster) poster.src=detail.poster_path? 'https://image.tmdb.org/t/p/w300'+detail.poster_path : '';
    document.getElementById('ticket').classList.add('show');
    document.getElementById('resultsList').innerHTML='';
    setStatus('Klar! Välj källa nedan för att spela.','info');
    loadPlayer(type, id, imdbId, 1, 1);
    window.scrollTo({top:document.getElementById('ticket').offsetTop-20, behavior:'smooth'});
  }catch(err){
    setStatus('Kunde inte ladda detaljer: '+err.message,'error');
  }
}

var SOURCES=[
  {key:'vsrc', name:'vsrc.su', base:'https://vsrc.su/embed'},
  {key:'embed', name:'embed.su', base:'https://embed.su/embed'},
  {key:'auto', name:'autoembed.cc', base:'https://autoembed.cc/embed'},
];
var activeSource='vsrc';

function buildUrl(source,type,id,imdbId,s,e){
  if(type==='tv') return source.base+'/tv/'+id+'/'+(s||1)+'/'+(e||1);
  return source.base+'/movie/'+id;
}

function loadPlayer(type,id,imdbId,season,episode){
  var src=SOURCES.find(function(s){ return s.key===activeSource; });
  var url=buildUrl(src,type,id,imdbId,season,episode);
  var iframe=document.getElementById('vidsrcFrame');
  if(!iframe) return;
  iframe.removeAttribute('sandbox');
  iframe.src=url;
  console.log('Player loaded:', url);
}

// BUTTONS
document.getElementById('goBtn').addEventListener('click', runSearch);
document.getElementById('query').addEventListener('keydown', function(e){ if(e.key==='Enter') runSearch(); });
document.getElementById('overlayFsBtn').addEventListener('click', function(){
  var pf=document.getElementById('playerFrame');
  if(document.fullscreenElement) document.exitFullscreen();
  else pf.requestFullscreen();
});
document.addEventListener('keydown', function(e){
  if(e.key.toLowerCase()==='h' || e.key.toLowerCase()==='f'){
    if(['INPUT','TEXTAREA','SELECT'].indexOf(e.target.tagName)===-1){
      var pf=document.getElementById('playerFrame');
      if(document.fullscreenElement) document.exitFullscreen();
      else pf.requestFullscreen();
    }
  }
});

// CC show on top hover
var pFrame=document.getElementById('playerFrame');
var ccControls=document.getElementById('ccControls');
function showCC(){ if(ccControls) ccControls.classList.add('visible'); }
function hideCC(){ if(ccControls) ccControls.classList.remove('visible'); }
if(pFrame){
  pFrame.addEventListener('mousemove', function(e){
    var rect=pFrame.getBoundingClientRect();
    var yRel=(e.clientY-rect.top)/rect.height;
    if(yRel<0.4) showCC();
  });
  pFrame.addEventListener('mouseleave', hideCC);
}

// Subtitle settings
var subSettings=JSON.parse(localStorage.getItem('kuribaxi_sub_settings')||'{"color":"#ffffff","size":18,"sizePercent":"100","bg":75,"delay":0,"font":"default"}');
var srtCues=[];
var srtOverlay=null;
var srtInterval=null;
var srtStartTime=0;

function applySubSettings(){
  if(!srtOverlay){
    var preview=document.getElementById('subPreviewText');
    if(preview){
      preview.style.color=subSettings.color;
      preview.style.fontSize=subSettings.size+'px';
      preview.style.background='rgba(0,0,0,'+subSettings.bg/100+')';
    }
    return;
  }
  srtOverlay.style.color=subSettings.color;
  srtOverlay.style.fontSize=subSettings.size+'px';
  srtOverlay.style.background='rgba(0,0,0,'+subSettings.bg/100+')';
}

function parseSRT(srt){
  var cues=[]; var blocks=srt.trim().split(/\n\s*\n/);
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i]; var lines=b.split('\n'); if(lines.length<2) continue;
    var timeLine=null; for(var j=0;j<lines.length;j++){ if(lines[j].indexOf('-->')!==-1){ timeLine=lines[j]; break; } }
    if(!timeLine) continue;
    var parts=timeLine.split(' --> ');
    function toSec(t){ var p=t.split(':'); var sec=parseFloat(p[2].replace(',','.')); return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + sec; }
    var start=toSec(parts[0]); var end=toSec(parts[1]);
    var idx=lines.indexOf(timeLine);
    var text=lines.slice(idx+1).join('\n');
    cues.push({start:start,end:end,text:text});
  }
  return cues;
}

function loadSRT(text){
  srtCues=parseSRT(text);
  if(!srtOverlay){
    srtOverlay=document.createElement('div');
    srtOverlay.id='srtOverlay';
    document.getElementById('playerFrame').appendChild(srtOverlay);
  }
  applySubSettings();
  srtStartTime=Date.now()/1000;
  if(srtInterval) clearInterval(srtInterval);
  srtInterval=setInterval(function(){
    var now=Date.now()/1000 - srtStartTime + (parseFloat(subSettings.delay)||0);
    var cue=null;
    for(var i=0;i<srtCues.length;i++){ var c=srtCues[i]; if(now>=c.start && now<=c.end){ cue=c; break; } }
    if(cue){ srtOverlay.textContent=cue.text; srtOverlay.style.display='block'; } else { srtOverlay.style.display='none'; }
  },100);
}

// Settings UI
document.getElementById('subSettingsBtn').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('subSettings').classList.toggle('show'); showCC(); });
document.getElementById('subSettingsClose').addEventListener('click', function(){ document.getElementById('subSettings').classList.remove('show'); });
document.getElementById('delayMinus').addEventListener('click', function(){ subSettings.delay=parseFloat((subSettings.delay-0.5).toFixed(1)); document.getElementById('subDelayVal').textContent=subSettings.delay+'s'; localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('delayPlus').addEventListener('click', function(){ subSettings.delay=parseFloat((subSettings.delay+0.5).toFixed(1)); document.getElementById('subDelayVal').textContent=subSettings.delay+'s'; localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('subResetTiming').addEventListener('click', function(){ subSettings.delay=0; document.getElementById('subDelayVal').textContent='0s'; localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('subColorInput').addEventListener('input', function(e){ subSettings.color=e.target.value; applySubSettings(); localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('subSizeSelect').addEventListener('change', function(e){ subSettings.sizePercent=e.target.value; subSettings.size=Math.round(18*parseInt(e.target.value)/100); applySubSettings(); localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('subBgSelect').addEventListener('change', function(e){ subSettings.bg=parseInt(e.target.value); applySubSettings(); localStorage.setItem('kuribaxi_sub_settings', JSON.stringify(subSettings)); });
document.getElementById('overlayCcBtn').addEventListener('click', function(){ showCC(); });
