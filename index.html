<div id="selectionSearchBox" style="display:none; position:fixed; z-index:2147483647;
     background:#121b2e; border:1px solid rgba(212,175,55,.32); border-radius:10px;
     padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); font-family:Manrope,sans-serif;">
  <div id="selectionSearchText" style="font-size:11px; color:#e8c766; font-weight:700;
       margin:2px 6px 6px; max-width:260px; white-space:nowrap; overflow:hidden;
       text-overflow:ellipsis;"></div>
  <div style="display:flex; gap:6px; flex-wrap:wrap;">
    <button data-engine="https://www.google.com/search?q="        style="all:unset; cursor:pointer; background:#c9a227; color:#1a1305; font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px;">🔎 Google</button>
    <button data-engine="https://www.youtube.com/results?search_query=" style="all:unset; cursor:pointer; background:rgba(201,162,39,.14); color:#e8c766; font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px; border:1px solid rgba(212,175,55,.32);">▶ YouTube</button>
    <button data-engine="https://www.imdb.com/find/?q="           style="all:unset; cursor:pointer; background:rgba(201,162,39,.14); color:#e8c766; font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px; border:1px solid rgba(212,175,55,.32);">🎬 IMDb</button>
    <button data-engine="https://sv.wikipedia.org/w/index.php?search=" style="all:unset; cursor:pointer; background:rgba(201,162,39,.14); color:#e8c766; font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px; border:1px solid rgba(212,175,55,.32);">📚 Wikipedia</button>
    <button id="selectionCopyBtn" style="all:unset; cursor:pointer; background:transparent; color:#a9a290; font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px; border:1px solid rgba(169,162,144,.4);">📋 Kopiera</button>
    <button id="selectionCloseBtn" style="all:unset; cursor:pointer; background:transparent; color:#f0938a; font-size:11px; font-weight:700; padding:5px 8px; border-radius:6px;">✕</button>
  </div>
</div>

<script>
(function () {
  var box = document.getElementById('selectionSearchBox');
  var label = document.getElementById('selectionSearchText');
  var currentText = '';
  var mouseX = 100, mouseY = 100;

  document.addEventListener('mousemove', function (e) {
    mouseX = e.clientX; mouseY = e.clientY;
  }, true);

  function hideBox() { box.style.display = 'none'; }

  function showBox(x, y) {
    box.style.display = 'block';
    var w = box.offsetWidth || 280;
    var h = box.offsetHeight || 80;
    var left = Math.min(Math.max(8, x), window.innerWidth - w - 8);
    var top = y + 14;
    if (top + h > window.innerHeight - 8) top = Math.max(8, y - h - 14);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    console.log('[sökmodul] popup visas för:', currentText);
  }

  function getSelectedText() {
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') &&
        active.selectionStart !== undefined &&
        active.selectionEnd > active.selectionStart) {
      return active.value.slice(active.selectionStart, active.selectionEnd);
    }
    var sel = window.getSelection ? window.getSelection() : null;
    return sel ? String(sel) : '';
  }

  function checkSelection(x, y) {
    var text = getSelectedText().trim();
    if (text && text.length >= 2 && text.length <= 200) {
      currentText = text;
      label.textContent = '"' + text + '"';
      if (x === undefined || x === null) {
        x = mouseX; y = mouseY;
        try {
          var sel = window.getSelection();
          if (sel && sel.rangeCount > 0) {
            var r = sel.getRangeAt(0).getBoundingClientRect();
            if (r && (r.width > 0 || r.height > 0)) { x = r.left; y = r.bottom; }
          }
        } catch (err) {}
      }
      showBox(x, y);
    } else {
      currentText = '';
      hideBox();
    }
  }

  document.addEventListener('mouseup', function (e) {
    if (box.contains(e.target)) return;
    setTimeout(function () { checkSelection(e.clientX, e.clientY); }, 10);
  });

  document.addEventListener('touchend', function (e) {
    if (box.contains(e.target)) return;
    var t = e.changedTouches && e.changedTouches[0];
    setTimeout(function () {
      checkSelection(t ? t.clientX : mouseX, t ? t.clientY : mouseY);
    }, 200);
  });

  Array.prototype.forEach.call(
    box.querySelectorAll('button[data-engine]'),
    function (btn) {
      btn.addEventListener('click', function () {
        if (!currentText) return;
        window.open(btn.getAttribute('data-engine') +
          encodeURIComponent(currentText), '_blank', 'noopener');
        hideBox();
      });
    }
  );

  document.getElementById('selectionCopyBtn').addEventListener('click', function () {
    if (!currentText) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentText);
    } else {
      var ta = document.createElement('textarea');
      ta.value = currentText; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    hideBox();
  });

  document.getElementById('selectionCloseBtn').addEventListener('click', hideBox);

  window.addEventListener('scroll', hideBox, true);
  window.addEventListener('resize', hideBox);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideBox();
  });
  document.addEventListener('mousedown', function (e) {
    if (!box.contains(e.target)) hideBox();
  }, true);
})();
</script>
